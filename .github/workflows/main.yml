name: Deploy Shiny App

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Installs a fast, pre-compiled R environment
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs only the minimal packages needed for your code
      - name: Install packages
        run: |
          install.packages(c("shiny", "bslib", "rsconnect"), dependencies = TRUE)
        shell: Rscript {0}

      # Deploys using the correctly formatted repository secrets
      - name: Authorize and Deploy
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          library(rsconnect)
          
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          
          rsconnect::deployApp(
            appDir = ".",
            appName = "passcode-shiny-app",
            forceUpdate = TRUE
          )
        shell: Rscript {0}

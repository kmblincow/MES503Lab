name: Deploy Shiny App

# Trigger the workflow every time code is pushed to the main branch
on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Check out the repository code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up R environment on the runner
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # 3. Install necessary R packages
      - name: Install packages
        run: |
          install.packages(c("shiny", "bslib", "rsconnect"), dependencies = TRUE)
        shell: Rscript {0}

      # 4. Authorize and Deploy to shinyapps.io
      - name: Authorize and Deploy
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets::SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets::SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets::SHINYAPPS_SECRET }}
        run: |
          library(rsconnect)
          
          # Set up account authentication
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          
          # Deploy the application
          # appDir "." points to the root directory where app.R sits
          rsconnect::deployApp(
            appDir = ".",
            appName = "passcode-shiny-app",
            forceUpdate = TRUE
          )
        shell: Rscript {0}
